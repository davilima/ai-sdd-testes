name: SDD Specification Validation

on:
  pull_request:
    paths:
      - '.sdd/specs/**'

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run SDD Validation Script
        run: python scripts/validate_sdd.py
